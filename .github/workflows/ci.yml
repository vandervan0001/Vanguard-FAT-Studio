name: FAT Studio verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.lock -r requirements-engineering.lock
      - name: Build the editor
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Bundle browser assets
        run: python scripts/build-web.py
      - name: Install application
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Static Python checks
        run: python -m ruff check fat_studio integrations tests scripts
      - name: Deterministic models, API, local OPC UA and engineering guards
        run: python -m pytest --junitxml=evidence/pytest-${{ matrix.os }}.xml
      - name: Installation diagnostic
        run: python -m fat_studio doctor --json
      - name: Install browser for interface tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end interface tests against the local Python service
        working-directory: frontend
        run: npm test
      - name: Build distributable wheel
        run: python -m build --wheel --no-isolation
      - name: Windows offline first installation in a new directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fatKit = Join-Path $env:RUNNER_TEMP 'FAT clean installation'
          .\scripts\prepare-offline.ps1 -Destination $fatKit -Python (Get-Command python).Source
          $env:PIP_NO_INDEX = '1'
          $env:PIP_INDEX_URL = 'http://127.0.0.1:9'
          & (Join-Path $fatKit 'scripts\setup.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Offline first installation failed' }
          python scripts/smoke-installed.py --python (Join-Path $fatKit '.venv\Scripts\python.exe') --output evidence/windows-clean-install.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed service smoke check failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fat-studio-${{ matrix.os }}
          path: |
            dist/*.whl
            evidence/pytest-*.xml
            evidence/windows-clean-install.json
            frontend/test-results/
          if-no-files-found: warn
