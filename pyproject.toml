[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-fat-studio"
version = "0.1.1"
description = "Local process simulation and Siemens virtual-PLC FAT workbench"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "FAT Studio contributors"}]
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
  "asyncua==1.1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1", "build>=1,<2"]
engineering = ["mcp==2.3.0"]

[project.scripts]
fat-studio = "fat_studio.cli:main"
fat-tia = "integrations.tia_engineering:main"

[tool.setuptools.packages.find]
include = ["fat_studio*", "integrations*"]

[tool.setuptools.package-data]
fat_studio = ["web/*", "web/assets/*", "vendor/historiansim/LICENSE", "vendor/historiansim/PROVENANCE.md"]
integrations = ["*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["fat_studio/vendor", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
