[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-fat-studio"
version = "0.4.0"
description = "Vanguard FAT Studio: local process simulation and virtual-PLC FAT workbench"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Vanguard FAT Studio contributors"}]
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
  "asyncua==1.1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1", "build>=1,<2"]
engineering = ["mcp==2.3.0"]

[project.scripts]
vanguard-fat-studio = "fat_studio.cli:main"
fat-studio = "fat_studio.cli:main"
fat-tia = "integrations.tia_engineering:main"

[project.urls]
Repository = "https://github.com/vandervan0001/Vanguard-FAT-Studio"
Issues = "https://github.com/vandervan0001/Vanguard-FAT-Studio/issues"

[tool.setuptools]
packages = ["fat_studio", "fat_studio.adapters", "fat_studio.vendor", "fat_studio.vendor.historiansim", "integrations"]
include-package-data = false

[tool.setuptools.cmdclass]
build_py = "build_public.PublicBuildPy"
sdist = "build_public.PublicSdist"

[tool.setuptools.package-data]
fat_studio = ["web/*", "web/assets/*", "web/brand/*", "vendor/historiansim/LICENSE", "vendor/historiansim/PROVENANCE.md"]
integrations = ["upstream.lock.json", "requirements-engineering.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["fat_studio/vendor", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
